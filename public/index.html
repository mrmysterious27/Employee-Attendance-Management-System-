<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Attendly — Employee Attendance</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div id="appLoader" class="app-loader" aria-hidden="true">
    <div class="loader-orb"><span></span></div>
    <div class="loader-brand">Attendly</div>
    <div class="loader-text" id="loaderText">Getting things ready…</div>
  </div>
  <div id="toast" class="toast"></div>

  <section id="authView" class="auth-shell">
    <div class="auth-card">
      <div class="brand-mark">A</div>
      <h1>Attendly</h1>
      <p class="muted">Employee Attendance Management System</p>
      <div class="tabs">
        <button class="tab active" data-auth="login">Login</button>
        <button class="tab" data-auth="register">Register</button>
      </div>
      <form id="authForm">
        <div id="nameField" class="field hidden">
          <label>Full name</label><input id="name" required>
        </div>
        <div class="field">
          <label>Email</label><input id="email" type="email" required>
        </div>
        <div class="field">
          <label>Password</label><input id="password" type="password" minlength="8" required>
        </div>
        <button class="primary full" type="submit" id="authSubmit">Sign in</button>
      </form>
      <div class="demo">
        <strong>Demo access</strong>
        <span>HR: hr@company.com / Admin@123</span>
        <span>Employee: employee@company.com / Employee@123</span>
      </div>
    </div>
  </section>

  <section id="appView" class="hidden">
    <aside class="sidebar">
      <div class="logo"><span>A</span><strong>Attendly</strong></div>
      <nav id="nav"></nav>
      <button id="logout" class="logout">Sign out</button>
    </aside>
    <main class="main">
      <header class="topbar">
        <div><span class="eyebrow">WORKSPACE</span><h2 id="pageTitle">Dashboard</h2></div>
        <div class="profile"><div class="avatar" id="avatar">U</div><div><b id="userName">User</b><small id="userRole"></small></div></div>
      </header>
      <div id="content"></div>
    </main>
  </section>
  <script src="/app.js"></script>
</body>
</html>
